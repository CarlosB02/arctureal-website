<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="100%" stop-color="#F0ECE3"/>
    </linearGradient>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#302D2A" stroke-width="0.35" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  <rect width="1200" height="750" fill="url(#archGrid)"/>

  <!-- Minimal Outer Frame -->
  <rect x="40" y="40" width="1120" height="670" fill="none" stroke="#302D2A" stroke-width="1" stroke-opacity="0.18"/>

  <!-- Corner registration ticks -->
  <line x1="30" y1="40" x2="50" y2="40" stroke="#C08440" stroke-width="1.5"/>
  <line x1="40" y1="30" x2="40" y2="50" stroke="#C08440" stroke-width="1.5"/>
  <line x1="1150" y1="40" x2="1170" y2="40" stroke="#C08440" stroke-width="1.5"/>
  <line x1="1160" y1="30" x2="1160" y2="50" stroke="#C08440" stroke-width="1.5"/>
  <line x1="30" y1="710" x2="50" y2="710" stroke="#C08440" stroke-width="1.5"/>
  <line x1="40" y1="700" x2="40" y2="720" stroke="#C08440" stroke-width="1.5"/>
  <line x1="1150" y1="710" x2="1170" y2="710" stroke="#C08440" stroke-width="1.5"/>
  <line x1="1160" y1="700" x2="1160" y2="720" stroke="#C08440" stroke-width="1.5"/>

  <!-- Architectural Composition -->
  
      <!-- Tower vertical rhythm -->
      <rect x="360" y="140" width="480" height="460" fill="#ECE7DE" stroke="#302D2A" stroke-width="2"/>
      <!-- Vertical louvers -->
      
        <line x1="400" y1="160" x2="400" y2="580" stroke="#C08440" stroke-width="3" stroke-opacity="0.9"/>
      
        <line x1="450" y1="160" x2="450" y2="580" stroke="#302D2A" stroke-width="1.5" stroke-opacity="0.4"/>
      
        <line x1="500" y1="160" x2="500" y2="580" stroke="#C08440" stroke-width="3" stroke-opacity="0.9"/>
      
        <line x1="550" y1="160" x2="550" y2="580" stroke="#302D2A" stroke-width="1.5" stroke-opacity="0.4"/>
      
        <line x1="600" y1="160" x2="600" y2="580" stroke="#C08440" stroke-width="3" stroke-opacity="0.9"/>
      
        <line x1="650" y1="160" x2="650" y2="580" stroke="#302D2A" stroke-width="1.5" stroke-opacity="0.4"/>
      
        <line x1="700" y1="160" x2="700" y2="580" stroke="#C08440" stroke-width="3" stroke-opacity="0.9"/>
      
        <line x1="750" y1="160" x2="750" y2="580" stroke="#302D2A" stroke-width="1.5" stroke-opacity="0.4"/>
      
        <line x1="800" y1="160" x2="800" y2="580" stroke="#C08440" stroke-width="3" stroke-opacity="0.9"/>
      
      <!-- Ground plinth -->
      <rect x="300" y="600" width="600" height="30" fill="#302D2A"/>
    

  <!-- Header Annotations -->
  <text x="70" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#302D2A">ARCTUREAL ARCHIVE / SEDE CORPORATIVA</text>
  <text x="1130" y="75" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="2" fill="#6E6962">38°43'16" N  9°08'55" W</text>

  <!-- Title Bottom Annotation -->
  <text x="70" y="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#302D2A">MARQUÊS HORIZON</text>
  <text x="1130" y="680" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="1.5" fill="#C08440">ESTUDO GEOMÉTRICO AUTORAL</text>
</svg>